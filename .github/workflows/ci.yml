name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  specs:
    runs-on: ubuntu-latest
    name: "Specs / Crystal ${{ matrix.crystal }}"
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.18", "latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install dependencies
        run: shards install
      - name: Run specs
        run: crystal spec --error-trace

  build:
    runs-on: ubuntu-latest
    name: "Build / Crystal latest"
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install dependencies
        run: shards install
      - name: Build shard
        run: crystal build src/faraday/multipart.cr

  format:
    runs-on: ubuntu-latest
    name: "Format check"
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Check formatting
        run: crystal tool format --check
